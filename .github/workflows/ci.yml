# Builds and tests the Windows game and tool, builds the vpk, and on a v* tag
# (or by hand) packages the three downloads as workflow artifacts. Nothing of
# the game is used: the tests that need its data skip.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pillow
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-s
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      - name: Godot 4.1.4 for the tool package
        if: env.PACKAGE == 'true'
        run: |
          curl -sSLO https://github.com/godotengine/godot/releases/download/4.1.4-stable/Godot_v4.1.4-stable_win64.exe.zip
          echo "387d830a9b57ae2e4c453c2aa046c8fd12851592497004f5f313098a6f5e121c400d30ae417dd7de87375a9a3d3ea35b554a5dd824cffcca2571120eb78a6e60  Godot_v4.1.4-stable_win64.exe.zip" | sha512sum -c
          python -m zipfile -e Godot_v4.1.4-stable_win64.exe.zip godot
          mkdir -p godot-licence
          curl -sSL -o godot-licence/LICENSE.txt https://raw.githubusercontent.com/godotengine/godot/4.1.4-stable/LICENSE.txt
          curl -sSL -o godot-licence/COPYRIGHT.txt https://raw.githubusercontent.com/godotengine/godot/4.1.4-stable/COPYRIGHT.txt
      - name: Package
        if: env.PACKAGE == 'true'
        run: |
          python tools/bake_menu_logo.py
          bash tools/release/package_windows.sh build godot/Godot_v4.1.4-stable_win64.exe godot-licence \
              "$(dirname "$(command -v gcc)")/SDL2.dll" "$VERSION" dist
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: windows-packages
          path: dist/*.zip
          if-no-files-found: error

  vita:
    runs-on: ubuntu-24.04
    env:
      VITASDK: ${{ github.workspace }}/../vitasdk
      VITASDK_TARBALL: vitasdk-x86_64-linux-gnu-2026-08-25_16-27-41.tar.bz2
    steps:
      - uses: actions/checkout@v4
      - name: vitasdk (sdk-snapshot-20260825.612.1, GCC 15.2.0)
        run: |
          curl -sSLO "https://github.com/vitasdk/autobuilds/releases/download/sdk-snapshot-20260825.612.1/$VITASDK_TARBALL"
          echo "49184a5fcc4dd75e9eb233422a56e5801b6a996d6e52b6ca71178788e9559f51  $VITASDK_TARBALL" | sha256sum -c
          mkdir -p "$VITASDK"
          tar -xjf "$VITASDK_TARBALL" -C "$VITASDK" --strip-components=1
          rm "$VITASDK_TARBALL"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pil
      - name: Vita libraries
        run: bash tools/vita/build_vita_libs.sh "$RUNNER_TEMP/vita-libs"
      - name: Build
        run: |
          python3 tools/bake_menu_logo.py
          cmake -S . -B build-vita -G Ninja -DBSHT_TARGET=vita -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-vita
      - name: Package
        run: |
          mkdir -p dist
          cp build-vita/src/bsht_vita.vpk "dist/BuckshotRoulettePortable-BSHT-$VERSION.vpk"
          unzip -l "dist/BuckshotRoulettePortable-BSHT-$VERSION.vpk"
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: vita-package
          path: dist/*.vpk
          if-no-files-found: error
      # The unstripped ELF reads the crash dumps of this exact build.
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: vita-elf
          path: build-vita/src/bsht_vita
          if-no-files-found: error
